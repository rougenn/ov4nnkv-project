name: meeting-assistant

services:
  mcp-followup:
    build: ./mcp-followup
    container_name: ma-mcp-followup
    env_file:
      - ./mcp-followup/.env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - meeting-assistant

  mcp-rag-local:
    build: ./mcp-rag-local
    container_name: ma-mcp-rag-local
    env_file:
      - ./mcp-rag-local/.env
    environment:
      PORT: "8002"
      RAG_STORE_PATH: "/app/data/rag_store.json"
      HF_HOME: "/app/.hf_cache"
    ports:
      - "8002:8002"
    volumes:
      - rag-store:/app/data
      - hf-cache:/app/.hf_cache
    restart: unless-stopped
    networks:
      - meeting-assistant

  mcp-google-calendar:
    build: ./mcp-google-calendar
    container_name: ma-mcp-google-calendar
    profiles: ["calendar"]
    env_file:
      - ./mcp-google-calendar/.env
    environment:
      PORT: "8001"
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - meeting-assistant

  agent:
    build: ./agent
    container_name: ma-agent
    env_file:
      - ./agent/.env
    environment:
      FOLLOWUP_MCP_URL: "http://mcp-followup:8000/mcp"
      MANAGED_RAG_MCP_URL: "http://mcp-rag-local:8002/mcp"
      GCALENDAR_MCP_URL: "http://mcp-google-calendar:8001/mcp"
      URL_AGENT: "http://agent:10000"
      PORT: "10000"
    ports:
      - "10000:10000"
    depends_on:
      - mcp-followup
      - mcp-rag-local
    restart: unless-stopped
    networks:
      - meeting-assistant

  telegram-bot:
    build: ./telegram-bot
    container_name: ma-telegram-bot
    env_file:
      - ./telegram-bot/.env
    environment:
      AGENT_API_URL: "http://agent:10000"
      AUTO_CONNECT_ON_START: "true"
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - meeting-assistant

  demo-app:
    build: ./demo-app
    container_name: ma-demo-app
    environment:
      AGENT_BASE_URL: "http://agent:10000"
      PORT: "5000"
    ports:
      - "5050:5000"
    depends_on:
      - agent
    restart: unless-stopped
    networks:
      - meeting-assistant

networks:
  meeting-assistant:
    driver: bridge

volumes:
  rag-store: {}
  hf-cache: {}
